spring:
  application:
    name: permission-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5433}/${DB_NAME:permission}
    username: ${DB_USER:permission}
    password: ${DB_PASSWORD:permission}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: ${DDL_AUTO:update}

server:
  port: ${SERVER_PORT:8081}

management:
  endpoints:
    web:
      exposure:
        include: health

# Con LOG_FORMAT=ecs, como en la imagen de Docker, los logs salen en JSON (Elastic Common Schema): una línea por
# log con el servicio (service.name) y el MDC (requestId, snippetId...) como campos. Sin LOG_FORMAT salen en
# texto, que es lo cómodo para leerlos corriendo desde el IDE o en los tests; el MDC va entre corchetes antes
# del logger (el replace saca los corchetes vacíos de los logs que no tienen contexto).
logging:
  structured:
    format:
      console: ${LOG_FORMAT:}
  pattern:
    correlation: '%replace([%mdc] ){''^\[\] $'', ''''}'
